<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreamento J16 - Live Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center shadow-md z-20">
        <h1 class="text-xl font-bold flex items-center gap-2">
            🛰️ Rastreamento J16 
            <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-0.5 rounded-full border border-emerald-500/30">Em Direto</span>
        </h1>
        <div id="status-veiculo" class="text-sm text-gray-400 font-medium">A aguardar sinal do rastreador...</div>
    </header>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar / Telemetria -->
        <aside class="w-80 bg-gray-800 border-r border-gray-700 p-6 flex flex-col gap-4 overflow-y-auto z-10 shadow-lg">
            <div class="bg-gray-900/60 p-4 rounded-xl border border-gray-700/80">
                <h2 class="text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Dispositivo</h2>
                <p id="info-imei" class="font-mono text-emerald-400 font-bold text-sm">IMEI: --</p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gray-900/60 p-4 rounded-xl border border-gray-700/80">
                    <span class="text-xs text-gray-400">Velocidade</span>
                    <p id="info-speed" class="text-2xl font-black text-white mt-1">0 <span class="text-xs font-normal text-gray-400">km/h</span></p>
                </div>
                <div class="bg-gray-900/60 p-4 rounded-xl border border-gray-700/80">
                    <span class="text-xs text-gray-400">Ignição</span>
                    <p id="info-ignition" class="text-base font-bold text-gray-400 mt-1">--</p>
                </div>
            </div>

            <div class="bg-gray-900/60 p-4 rounded-xl border border-gray-700/80 flex-1 flex flex-col justify-between">
                <div>
                    <h3 class="text-xs uppercase tracking-wider text-gray-400 font-semibold mb-2">Coordenadas Atuais</h3>
                    <p id="info-coords" class="text-xs font-mono text-gray-300 break-all leading-relaxed">Lat: --<br>Lng: --</p>
                </div>
                <p id="info-time" class="text-[10px] text-gray-500 mt-4">Última atualização: --</p>
            </div>
        </aside>

        <!-- Map Container -->
        <main class="flex-1 relative">
            <div id="map" class="w-full h-full z-0"></div>
        </main>
    </div>

    <script>
        // Credenciais do Supabase
        const SUPABASE_URL = "https://zrpvmeaurqlurjwylcoq.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpycHZtZWF1cnFsdXJqd3lsY29xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NDcyNzQsImV4cCI6MjEwNzMyMzI3NH0.2w9KvzwX3XG0t2-AV5HK2sPuLH23WlUK_rLyhj_HNiM";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Inicializar o Mapa centralizado em São José dos Pinhais / Curitiba
        const map = L.map('map').setView([-25.5350, -49.1920], 15);

        // 🗺️ Camada de Ruas do Google Maps
        L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '&copy; Google Maps'
        }).addTo(map);

        let marker = null;

        // Função para atualizar os elementos na interface
        function atualizarInterface(dados) {
            const { imei, latitude, longitude, speed, ignition, updated_at } = dados;

            document.getElementById('info-imei').innerText = `IMEI: ${imei}`;
            document.getElementById('info-speed').innerHTML = `${speed} <span class="text-xs font-normal text-gray-400">km/h</span>`;
            
            const ignElem = document.getElementById('info-ignition');
            if (ignition) {
                ignElem.innerText = "Ligada";
                ignElem.className = "text-base font-bold text-emerald-400 mt-1";
            } else {
                ignElem.innerText = "Desligada";
                ignElem.className = "text-base font-bold text-red-400 mt-1";
            }

            document.getElementById('info-coords').innerHTML = `Lat: ${latitude.toFixed(6)}<br>Lng: ${longitude.toFixed(6)}`;
            document.getElementById('info-time').innerText = `Atualizado: ${new Date(updated_at || Date.now()).toLocaleTimeString()}`;
            document.getElementById('status-veiculo').innerText = "🟢 Online (Tempo Real)";

            const latLng = [latitude, longitude];
            if (!marker) {
                marker = L.marker(latLng).addTo(map);
                marker.bindPopup(`<b>IMEI: ${imei}</b><br>Velocidade: ${speed} km/h`).openPopup();
            } else {
                marker.setLatLng(latLng);
                marker.setPopupContent(`<b>IMEI: ${imei}</b><br>Velocidade: ${speed} km/h`);
            }

            // Centraliza o mapa acompanhando o movimento do veículo
            map.panTo(latLng);
        }

        // Carregar a última posição da tabela de estado atual ao iniciar
        async function carregarUltimaPosicao() {
            const { data, error } = await supabaseClient
                .from('veiculos_atual')
                .select('*')
                .limit(1);

            if (data && data.length > 0) {
                atualizarInterface(data[0]);
            } else {
                document.getElementById('status-veiculo').innerText = "🟡 A aguardar dados do simulador...";
            }
        }

        carregarUltimaPosicao();

        // ⚡ Subscrição WebSocket em tempo real para a tabela 'veiculos_atual'
        supabaseClient
            .channel('changes-veiculos-atual')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'veiculos_atual' }, payload => {
                if (payload.new) {
                    atualizarInterface(payload.new);
                }
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    console.log('Conectado ao Realtime do Supabase!');
                }
            });
    </script>
</body>
</html>
